name: ${COMPOSE_PROJECT_NAME:-modelroute}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: postgres
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      NEWAPI_DB_NAME: ${NEWAPI_DB_NAME}
      NEWAPI_DB_USER: ${NEWAPI_DB_USER}
      NEWAPI_DB_PASSWORD: ${NEWAPI_DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    networks: [backend]

  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:v1.0.0-rc.21@sha256:428018a37c0b26c163a3367c18401161707cd0e08d0f26a3dde9ff0caa05e34c}
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    environment:
      SQL_DSN: postgresql://${NEWAPI_DB_USER}:${NEWAPI_DB_PASSWORD}@postgres:5432/${NEWAPI_DB_NAME}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET}
      CRYPTO_SECRET: ${NEWAPI_CRYPTO_SECRET}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      TZ: Asia/Shanghai
    volumes:
      - ./data/new-api:/data
      - ./data/new-api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":[[:space:]]*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend, egress]

  platform-api:
    image: ${PLATFORM_IMAGE:-modelroute-platform-api:dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      NEW_API_BASE_URL: http://new-api:3000
      DEPENDENCY_TIMEOUT: 3s
      NEW_API_REQUEST_TIMEOUT: ${NEW_API_REQUEST_TIMEOUT}
      NEW_API_ADMIN_USERNAME: ${NEW_API_ADMIN_USERNAME}
      NEW_API_ADMIN_PASSWORD: ${NEW_API_ADMIN_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_TTL: ${SESSION_TTL}
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health/ready | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    networks: [backend, egress]

  platform-worker:
    image: ${PLATFORM_IMAGE:-modelroute-platform-api:dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}
    entrypoint: ["/usr/local/bin/modelroute-worker"]
    restart: unless-stopped
    environment:
      PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      NEW_API_BASE_URL: http://new-api:3000
      DEPENDENCY_TIMEOUT: 3s
      NEW_API_REQUEST_TIMEOUT: ${NEW_API_REQUEST_TIMEOUT}
      NEW_API_ADMIN_USERNAME: ${NEW_API_ADMIN_USERNAME}
      NEW_API_ADMIN_PASSWORD: ${NEW_API_ADMIN_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_TTL: ${SESSION_TTL}
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY}
      TZ: Asia/Shanghai
    depends_on:
      platform-api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [backend, egress]

  model-seed:
    profiles: [tools]
    image: ${PLATFORM_IMAGE:-modelroute-platform-api:dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}
    entrypoint: ["/usr/local/bin/modelroute-seed-models"]
    restart: "no"
    environment:
      PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME}?sslmode=disable
      NEW_API_BASE_URL: http://new-api:3000
      NEW_API_REQUEST_TIMEOUT: ${NEW_API_REQUEST_TIMEOUT}
      NEW_API_ADMIN_USERNAME: ${NEW_API_ADMIN_USERNAME}
      NEW_API_ADMIN_PASSWORD: ${NEW_API_ADMIN_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      new-api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [backend, egress]

  gateway:
    image: ${GATEWAY_IMAGE:-modelroute-platform-gateway:dev}
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE:-node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-127.0.0.1:28100}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend, edge]

networks:
  backend:
    internal: true
  egress:
  edge:
