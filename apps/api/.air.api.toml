root = "/src/apps/api"
tmp_dir = "/tmp/modelroute-api"

[build]
cmd = "cd /src/apps/api && CGO_ENABLED=0 go build -o /tmp/modelroute-api/modelroute-api ./cmd/api"
bin = "/tmp/modelroute-api/modelroute-api"
include_ext = ["go", "sql", "json"]
exclude_dir = [".git", "node_modules", "dist", "data"]
delay = 300
poll = true
poll_interval = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
